{% extends "plantilla/master.html" %}
{% load static %}


{% block contenido %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://unpkg.com/tabulator-tables@6.4.0/dist/css/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.4.0/dist/js/tabulator.min.js"></script>
    <link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator_bootstrap5.min.css" rel="stylesheet">

    <style type="text/tailwindcss">
        .btn_style{
            @apply rounded p-2 text-[14px];
        }

        p{
            margin-bottom: 0 !important;
        }

        .status_base{
            @apply rounded px-2 py-1 border-2 text-wrap text-center;
        }

        .status_red{
            @apply border-[#EF4444] bg-[#FEE2E2] text-[#DC2626];
        }

        .status_yellow{
            @apply border-[#FACC15] bg-[#FFFDE7] text-[#AF7800];
        }

        .status_green{
            @apply border-[#22C55E] bg-[#E6FFED] text-[#16A34A];
        }

        .status_blue{
            @apply border-[#3B82F6] bg-[#DBEAFE] text-[#2563EB];
        }

        .btn_option_tab{
            @apply border-[2px] border-gray-400 rounded p-1 hover:bg-white;
        }


    </style>


        <div class="flex justify-end">
            <p class="text-white bg-[#12284c] py-4 px-2 text-[30px] rounded-l-lg">Administración de mis evaluaciones</p>
        </div>

        <div class="flex justify-between my-2 items-end">
            <p class="text-[16px] font-semibold my-2">Mis evaluaciones</p>
            <a href="{% url 'Administration:ControlEvaluation' action='Creation' %}" class="btn_style !bg-green-600 text-white !no-underline" >Crear evaluación</a>
        </div>
        <div id="tab_evaluations" class="!text-[12px]"></div>
        

        <p class="text-[16px] font-semibold mt-4">Asignar evaluación del mes</p>
        <div id="tab_route" class="!text-[12px]"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <script>
            var data_evaluation=[
                { name:'123-452',description:'Evaluación de mayo TI', department:'Transformación e innovación', create_for:'Osvaldo', date_creation:'15/05/2026', status:'Borrador'},
                { name:'123-452',description:'Evaluación de mayo TI', department:'Transformación e innovación', create_for:'Osvaldo', date_creation:'15/05/2026', status:'Sin asignar'},
                { name:'123-452',description:'Evaluación de mayo TI', department:'Transformación e innovación', create_for:'Osvaldo', date_creation:'15/05/2026', status:'Asignada'}
            ]
            var tab_evaluations = new Tabulator("#tab_evaluations", {
                height:"400px",
                layout:"fitColumns",
                data:data_evaluation,
                columns:[
                        { title: "#", formatter: "rownum", width: 60 },
                        { title:"Nombre", field:"name", width: 120},
                        { title:"Descripción", field:"description"},
                        { title:"Departamento", field:"department"},
                        { title:"Creada por", field:"create_for", width: 150},
                        { title:"Fecha de creación", field:"date_creation", width: 150},
                        { title:"Estatus", field:"status", width: 180,
                            formatter: function(cell, formatterParams, onRendered){

                                var text= document.createElement('p')
                                text.classList.add('status_base');
                                text.innerHTML=cell.getValue();
                                
                                if(cell.getValue()=='Sin asignar') {
                                    text.classList.add('status_yellow');
                                }else if(cell.getValue()=='Asignada') {
                                    text.classList.add('status_green');
                                }
                                else if(cell.getValue()=='Borrador') {
                                    text.classList.add('status_blue');
                                }

                                return text;
                            }
                        },
                        { title:"", field:"options", width: 160, hozAlign:"center",
                            formatter: function(cell, formatterParams, onRendered){
                                var div_btn = document.createElement('div');
                                div_btn.classList.add('flex','gap-2', 'max-h-[35px]');

                                var row=cell.getRow();
                                var data=row.getData();

                               var btn_edit=document.createElement('button');
                               btn_edit.type='button';
                               btn_edit.classList.add('btn_option_tab');

                               var img_edit=document.createElement('img');
                               img_edit.src='/static/img/editar.png';
                               img_edit.classList.add('w-5','h-5');
                               btn_edit.append(img_edit);

                               var btn_clone=document.createElement('button');
                               btn_clone.type='button';
                               btn_clone.classList.add('btn_option_tab');

                               var img_clone=document.createElement('img');
                               img_clone.src='/static/img/duplicar.png';
                               img_clone.classList.add('w-5','h-5');
                               btn_clone.append(img_clone);

                               var btn_delete=document.createElement('button');
                               btn_delete.type='button';
                               btn_delete.classList.add('btn_option_tab');

                               var img_delete=document.createElement('img');
                               img_delete.src='/static/img/eliminar.png';
                               img_delete.classList.add('w-5','h-5');
                               btn_delete.append(img_delete);


                               div_btn.append(btn_edit);
                               div_btn.append(btn_clone);
                               div_btn.append(btn_delete);

                                return div_btn;
                            }
                        },
                ]}
            );

            var tab_route = new Tabulator("#tab_route", {
                height:"400px",
                layout:"fitColumns",
                columns:[
                        { title: "#", formatter: "rownum", width: 60 },
                        { title:"Empleado", field:"name"},
                        { title:"Evaluador", field:"evaluator"},
                        { title:"Evaluación asignada", field:"evaluation_assigned"},
                        { title:"Estatus", field:"status"},
                        { title:"", field:"options"},
                ]}
            );



        </script>

{% endblock %}

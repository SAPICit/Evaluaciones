{% load static %}

<div class="flex justify-between items-end border-b-[2px] border-gray-300 pb-1 px-1">

    <p class="text-[14px]">
        {{ title }}
    </p>

    <button type="button" class="add-form-btn rounded bg-blue-500 text-white py-1 px-2 flex gap-2 items-center !text-[12px] text-center" data-prefix="{{ prefix }}">
        <img class="!m-0 w-[12px] h-[12px] invert" src="{% static 'img/agregar-2.png' %}" alt="">
        <p>Agregar</p>
    </button>

</div>

{{ formset.management_form }}

<!-- FORMS VISIBLES -->
<div id="{{ prefix }}-container" class="flex flex-col gap-2 mt-2">

    {% for form in formset %}

        <div class="dynamic-form {{ prefix }}-form bg-zinc-100 p-2 rounded">

            {{ form.id }}

            <div class="flex justify-between mb-1">

                <button type="button" class="btn_option_tab">
                    <img class="!m-0 w-3 h-3" src="{% static 'img/mover_lineas.png' %}" alt="">
                </button>

                <button type="button" class="btn_option_tab remove-form-btn">
                    <img class="!m-0 w-3 h-3" src="{% static 'img/eliminar.png' %}" alt="">
                </button>

            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-2">

                <div class="flex flex-col gap-2 !text-[14px]">
                    {{ form.area.label_tag }}
                    {{ form.area }}
                </div>

                <div class="flex flex-col gap-2 !text-[14px]">
                    {{ form.metodo.label_tag }}
                    {{ form.metodo }}
                </div>

                <div class="flex flex-col gap-2 !text-[14px]">
                    {{ form.objetivo.label_tag }}
                    {{ form.objetivo }}
                </div>

                <div class="flex flex-col gap-2 !text-[14px]">
                    {{ form.valor.label_tag }}
                    {{ form.valor }}
                </div>

            </div>

        </div>

    {% endfor %}

</div>


<!-- TEMPLATE VACÍO -->
<template id="{{ prefix }}-empty-form">

    <div class="dynamic-form {{ prefix }}-form bg-zinc-100 p-2 rounded">

        <div class="flex justify-between mb-1">

            <button type="button" class="btn_option_tab">
                <img class="!m-0 w-3 h-3" src="{% static 'img/mover_lineas.png' %}" alt="">
            </button>

            <button type="button" class="btn_option_tab remove-form-btn">
                <img class="!m-0 w-3 h-3" src="{% static 'img/eliminar.png' %}" alt="">
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-2">

            <div class="flex flex-col gap-2 !text-[14px]">
                {{ formset.empty_form.area.label_tag }}
                {{ formset.empty_form.area }}
            </div>

            <div class="flex flex-col gap-2 !text-[14px]">
                {{ formset.empty_form.metodo.label_tag }}
                {{ formset.empty_form.metodo }}
            </div>

            <div class="flex flex-col gap-2 !text-[14px]">
                {{ formset.empty_form.objetivo.label_tag }}
                {{ formset.empty_form.objetivo }}
            </div>

            <div class="flex flex-col gap-2 !text-[14px]">
                {{ formset.empty_form.valor.label_tag }}
                {{ formset.empty_form.valor }}
            </div>

        </div>

    </div>

</template>
